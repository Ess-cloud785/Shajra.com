<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhammad Fazal</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <style>
        :root {
            color-scheme: light dark;
            --bg: #f4f7ff;
            --surface: rgba(255, 255, 255, 0.74);
            --surface-strong: rgba(255, 255, 255, 0.92);
            --border: rgba(255, 255, 255, 0.62);
            --text: #07111f;
            --muted: #51607a;
            --accent: linear-gradient(135deg, #4f46e5 0%, #8b5cf6 45%, #06b6d4 100%);
            --accent-strong: #4f46e5;
            --shadow: 0 24px 70px rgba(15, 23, 42, 0.16);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #07111f;
                --surface: rgba(9, 16, 31, 0.78);
                --surface-strong: rgba(9, 16, 31, 0.92);
                --border: rgba(255, 255, 255, 0.12);
                --text: #f8fafc;
                --muted: #b5c0d0;
                --accent-strong: #8b5cf6;
                --shadow: 0 24px 70px rgba(2, 6, 23, 0.45);
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, rgba(79, 70, 229, 0.8), rgba(6, 182, 212, 0.8));
            border-radius: 999px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at top left, rgba(79, 70, 229, 0.2), transparent 28%),
                radial-gradient(circle at bottom right, rgba(6, 182, 212, 0.18), transparent 26%),
                var(--bg);
            color: var(--text);
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.16), transparent 50%);
            pointer-events: none;
        }

        .tree {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: min(1240px, 100%);
            padding: 28px 24px 34px;
            border-radius: 36px;
            border: 1px solid var(--border);
            background: var(--surface);
            backdrop-filter: blur(22px) saturate(140%);
            -webkit-backdrop-filter: blur(22px) saturate(140%);
            box-shadow: var(--shadow);
            position: relative;
            animation: fadeUp 0.7s ease both;
        }

        .generation {
            display: flex;
            justify-content: center;
            margin: 18px 0;
            flex-direction: row;
            flex-wrap: wrap;
            gap: clamp(18px, 2.8vw, 42px);
        }

        .member {
            text-align: center;
            position: relative;
            padding: 16px 12px;
            border-radius: 24px;
            background: var(--surface-strong);
            border: 1px solid var(--border);
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            min-width: 182px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .member:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.14);
        }

        .member img {
            width: min(150px, 24vw);
            height: min(150px, 24vw);
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.9);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            object-fit: cover;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.2);
        }

        .member img:hover {
            transform: scale(1.03);
            box-shadow: 0 22px 46px rgba(15, 23, 42, 0.24);
        }

        .connector {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 6px 0;
        }

        .connector .line {
            height: 2px;
            width: min(640px, 70%);
            background: linear-gradient(90deg, transparent, var(--accent-strong), transparent);
            border-radius: 999px;
            opacity: 0.8;
        }

        .member p {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 12px;
            line-height: 1.4;
            color: var(--text);
        }

        p a {
            text-decoration: none;
            color: var(--text);
            transition: color 0.2s ease;
        }

        p a:hover {
            color: var(--accent-strong);
        }

        .btn button {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 48px;
            height: 48px;
            border-radius: 999px;
            border: none;
            display: grid;
            place-items: center;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.14);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .btn button:hover {
            transform: scale(1.04);
            box-shadow: 0 16px 34px rgba(15, 23, 42, 0.18);
        }

        .btn button a {
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
            text-decoration: none;
        }

        .btn button a img {
            width: 24px;
            height: 24px;
            filter: brightness(0) saturate(100%) invert(18%) sepia(15%) saturate(1457%) hue-rotate(192deg) brightness(93%) contrast(95%);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 900px) {
            .generation {
                flex-direction: column;
            }

            .connector .line {
                display: none;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .tree {
                padding: 24px 14px 28px;
                border-radius: 24px;
            }

            .member {
                min-width: 0;
            }

            .btn button {
                top: 12px;
                right: 12px;
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>

<body>
    <div class="tree">
        <!-- First Generation -->
        <div class="generation">
            <div class="member">
                <img src="images/fazal.jpg" alt="Grandparent" />
                <p>Muhhamad Fazal</p>
            </div>
        </div>
        <!-- Second Generation -->
        <div class="connector">
            <div class="line"></div>
        </div>

        <div class="generation">
            <div class="member">
                <a href="#"><img src="images/farooq.jpg" alt="Parent 1" /></a>
                <p><a href="#">Muhammad Farooq (Late)</a></p>
            </div>
            <div class="member">
                <a href="rouf/rouf.html">
                    <img src="images/rauf.jpg" alt="Parent 1" /></a>
                <p><a href="rouf/rouf.html">Abdul Rouf Saqi</a></p>
            </div>

            <div class="member">
                <a href="hussain/hussain.html"><img src="images/husain.jpg" alt="Parent 2" /></a>
                <p><a href="hussain/hussain.html">Muhammad Hussain</a></p>
            </div>

            <div class="member">
                <a href="afzal/afzal.html"><img src="images/afzal.jpg" alt="" /></a>
                <p><a href="afzal/afzal.html">Muhammad Afzal Saghar</a></p>
            </div>
        </div>

        <div class="generation">
            <div class="member">
                <a href="naveed/naveed.html"><img src="images/naveed.jpg" alt="Parent 1" /></a>
                <p><a href="naveed/naveed.html">Naveed Safi</a></p>
            </div>

        </div>
    </div>
</body>

</html>
