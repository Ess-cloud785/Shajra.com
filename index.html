<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7ff;
      --surface: rgba(255, 255, 255, 0.72);
      --surface-strong: rgba(255, 255, 255, 0.92);
      --border: rgba(255, 255, 255, 0.6);
      --text: #07111f;
      --muted: #51607a;
      --accent: linear-gradient(135deg, #4f46e5 0%, #8b5cf6 45%, #06b6d4 100%);
      --accent-strong: #4f46e5;
      --shadow: 0 24px 70px rgba(15, 23, 42, 0.16);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #07111f;
        --surface: rgba(9, 16, 31, 0.78);
        --surface-strong: rgba(9, 16, 31, 0.9);
        --border: rgba(255, 255, 255, 0.12);
        --text: #f8fafc;
        --muted: #b5c0d0;
        --accent-strong: #8b5cf6;
        --shadow: 0 24px 70px rgba(2, 6, 23, 0.45);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top left, rgba(79, 70, 229, 0.24), transparent 28%),
        radial-gradient(circle at bottom right, rgba(6, 182, 212, 0.18), transparent 26%),
        var(--bg);
      color: var(--text);
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.6;
      pointer-events: none;
    }

    body::before {
      top: -90px;
      left: -70px;
      background: rgba(79, 70, 229, 0.28);
    }

    body::after {
      bottom: -110px;
      right: -80px;
      background: rgba(6, 182, 212, 0.22);
    }

    .welcome-container {
      position: relative;
      z-index: 1;
      max-width: 810px;
      width: min(100%, 810px);
      padding: 42px 34px;
      background: var(--surface);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      border: 1px solid var(--border);
      border-radius: 32px;
      box-shadow: var(--shadow);
      animation: fadeUp 0.7s ease both;
    }

    .welcome-container::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.3), transparent 55%, rgba(255, 255, 255, 0.12));
      pointer-events: none;
    }

    .welcome-container h1 {
      font-size: clamp(1.8rem, 4vw, 3.05rem);
      margin-bottom: 18px;
      color: var(--text);
      letter-spacing: -0.03em;
      font-weight: 800;
    }

    .welcome-container p {
      font-size: 1.05rem;
      margin-bottom: 28px;
      line-height: 1.7;
      color: var(--muted);
      max-width: 660px;
      margin-inline: auto;
    }

    .welcome-container img {
      width: min(220px, 56vw);
      border-radius: 50%;
      border: 5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.2);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      margin-bottom: 14px;
    }

    .welcome-container img:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 24px 56px rgba(15, 23, 42, 0.24);
    }

    .welcome-container button {
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 999px;
      cursor: pointer;
      background: var(--accent);
      color: white;
      box-shadow: 0 12px 30px rgba(79, 70, 229, 0.24);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }


    .welcome-container button:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 16px 34px rgba(79, 70, 229, 0.3);
    }

    .welcome-container button a {
      text-decoration: none;
      color: inherit;
      display: inline-block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .creator {
      color: var(--accent-strong);
      font-weight: 700;
      position: relative;
      transition: color 0.2s ease;
    }

    .creator:hover {
      color: var(--text);
    }

    .material-symbols-outlined {
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 18px;
      }

      .welcome-container {
        padding: 28px 20px;
        border-radius: 24px;
      }

      .welcome-container h1 {
        font-size: 2rem;
      }

      .welcome-container p {
        font-size: 0.98rem;
      }

      .welcome-container img {
        width: min(190px, 46vw);
      }

      .welcome-container button {
        padding: 13px 22px;
        font-size: 0.96rem;
        width: 100%;
      }
    }

    @media (max-width: 480px) {
      .welcome-container {
        padding: 24px 16px;
      }

      .welcome-container h1 {
        font-size: 1.9rem;
      }

      .welcome-container p {
        font-size: 0.95rem;
      }

      .welcome-container img {
        width: min(170px, 42vw);
      }

      .welcome-container button {
        padding: 12px 18px;
      }
    }
  </style>
</head>

  <div class="welcome-container">
    <h1>Welcome to the Ghulam Fareed</h1>
    <a href="index2.html"><img src="images/ghulam fraid.png" alt="" /></a>
    <p>This Website Is Created By <a class="creator" href="fazal\afzal\afzal.html">Muhammad Ismail</a> and
      <a class="creator" href="fazal\rouf\rouf.html">Muhammad Ibrahim</a></p>
    <button><a href="index2.html">Explore</a></button>
  </div>
</body>

</html>
